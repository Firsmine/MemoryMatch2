<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Match</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container" id="container">
      <header>
        <h1 class="title">Memory Match</h1>
        <p class="subtitle">Match the photos!</p>

        <div class="infoBar">
          <div class="stat">Time: <span id="timer">60</span>s</div>
          <div class="stat">Score: <span id="score">0</span></div>
          <div class="stat">High Score: <span id="highScore">0</span></div>
        </div>

        <div class="login" id="login">
          <input
            type="text"
            placeholder="Enter your name"
            id="usernameInput"
            class="input"
          />
          <select class="input" id="difficultyInput">
            <option value="" disabled selected>Select Level</option>
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
        <button id="btnStart" class="btn">Start Game</button>
        <button id="btnInstruction" class="btn">How To Play</button>
      </header>

      <main class="gameBoard" id="gameBoard"></main>
    </div>

    <div class="modal" id="instructionModal">
      <h1>How To Play</h1>
      <ol class="instructions">
        <li>Input username</li>
        <li>Select difficulty</li>
        <li>Click Button Start Game</li>
        <li>Click the cards and match it</li>
        <li>Enjoy!</li>
      </ol>
      <button class="btn" id="btnOk">Ok</button>
    </div>

    <div class="modal" id="win">
      <h1>You Win!</h1>
      <div class="winInfo">
        <span id="scoreWin"></span>
        <span id="bonusWin"></span>
        <span id="totalWin"></span>
        <span id="highScoreWin"></span>
      </div>
      <button id="btnPlayAgain" class="btn btnPlayAgain">Play Again</button>
      <button id="btnHome" class="btn">Home</button>
    </div>
    <div class="modal" id="lose">
      <h1>Game Over!</h1>
      <p>You ran out of time!</p>
      <p class="scoreLose"><span id="scoreLose"></span></p>
      <button id="btnPlayAgainLose" class="btn btnPlayAgain">Play Again</button>
    </div>
    <div class="modal" id="countModal">
      <span class="countdown" id="countdown">3</span>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
