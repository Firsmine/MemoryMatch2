<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Match</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1 class="title">Memory Match</h1>
        <p class="subtitle">Match the photos!</p>

        <div class="infoBar">
          <div class="stat">Time: <span id="timer">60</span>s</div>
          <div class="stat">Score: <span id="score">0</span></div>
          <div class="stat">High Score: <span id="highScore">0</span></div>
        </div>
        <button id="btnStart">Start Game</button>
      </header>

      <main class="gameBoard" id="gameBoard"></main>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
